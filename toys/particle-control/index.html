<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/style.css" />
    <style>
        /* Reset margins and make the canvas fill the entire screen */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        /* Hint overlay */
        .hint {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 10;
        }
        .hint-text {
            display: inline-block;
            padding: 0.4rem 1.1rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 999px;
            color: rgba(255,255,255,0.45);
            font-size: 0.78rem;
            font-family: var(--font-mono, monospace);
            letter-spacing: 0.04em;
            backdrop-filter: blur(8px);
            animation: hintFade 3s ease 1.5s forwards;
            opacity: 1;
        }
        @keyframes hintFade {
            0%   { opacity: 1; }
            70%  { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

<a href="../../index.html" class="back-btn" aria-label="Back to home">← Back</a>

<canvas id="particleCanvas"></canvas>

<div class="hint" id="hint">
    <span class="hint-text">Move or hold to swarm · Release to scatter</span>
</div>

<script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, isDown: false };

    // Adjust canvas size to fit the window
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Track pointer position and clicks for mouse + touch
    function setPointerPosition(e) {
        const point = e.touches ? e.touches[0] : e;
        mouse.x = point.clientX;
        mouse.y = point.clientY;
    }

    function pointerDown(e) {
        if (e.target && e.target.closest && e.target.closest('.back-btn')) return;
        setPointerPosition(e);
        mouse.isDown = true;
    }

    function pointerUp(e) {
        if (e && e.target && e.target.closest && e.target.closest('.back-btn')) return;
        mouse.isDown = false;
        // Explosion effect on release
        particles.forEach(p => {
            const dx = p.x - mouse.x;
            const dy = p.y - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const power = 10 + Math.random() * 10;
            p.vx = (dx / dist) * power;
            p.vy = (dy / dist) * power;
        });
    }

    window.addEventListener('mousemove', setPointerPosition);
    window.addEventListener('mousedown', pointerDown);
    window.addEventListener('mouseup', pointerUp);

    window.addEventListener('touchstart', (e) => {
        if (e.target.closest && e.target.closest('.back-btn')) return;
        e.preventDefault();
        pointerDown(e);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
        if (e.target.closest && e.target.closest('.back-btn')) return;
        e.preventDefault();
        setPointerPosition(e);
    }, { passive: false });

    window.addEventListener('touchend', pointerUp);
    window.addEventListener('touchcancel', pointerUp);

    class Particle {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 0.5) * 4;
            
            // Tail settings
            this.history = [];
            this.maxHistory = 35; // Increased tail length
            this.baseSize = 10; // Base size of the particle
            
            // Circle formation settings
            this.angle = Math.random() * Math.PI * 2;
            this.radius = Math.random() * 80 + 20; // Spread of the circle
            this.rotationDirection = Math.random() < 0.5 ? 1 : -1; // Mix clockwise and anti-clockwise orbits
            
            // State tracking
            this.collisionTimer = 0;
        }

        update(allParticles) {
            if (mouse.isDown) {
                // Slowly rotate their target position to create a swirling circle,
                // with a mix of clockwise and anti-clockwise motion.
                this.angle += 0.03 * this.rotationDirection;
                const targetX = mouse.x + Math.cos(this.angle) * this.radius;
                const targetY = mouse.y + Math.sin(this.angle) * this.radius;
                
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                
                // Much slower pull toward the mouse
                this.vx += dx * 0.015;
                this.vy += dy * 0.015;
            } else {
                // Wander more energetically when not grabbed so the swarm stays lively.
                this.vx += (Math.random() - 0.5) * 1.2;
                this.vy += (Math.random() - 0.5) * 1.2;
            }

            // Apply friction
            this.vx *= 0.92;
            this.vy *= 0.92;

            this.x += this.vx;
            this.y += this.vy;

            // Keep particles inside the screen bounds
            if (this.x < 0) { this.x = 0; this.vx *= -1; }
            if (this.x > width) { this.x = width; this.vx *= -1; }
            if (this.y < 0) { this.y = 0; this.vy *= -1; }
            if (this.y > height) { this.y = height; this.vy *= -1; }

            // Handle Collisions (prevent passing through each other)
            if (this.collisionTimer > 0) this.collisionTimer--;

            for (let i = 0; i < allParticles.length; i++) {
                const other = allParticles[i];
                if (other === this) continue; // Don't check collision against itself

                const dx = this.x - other.x;
                const dy = this.y - other.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                // Minimum distance allowed (particle size + small padding)
                const minDist = this.baseSize + 2; 

                if (dist < minDist && dist > 0) {
                    // Trigger collision color timer for both
                    this.collisionTimer = 15;
                    other.collisionTimer = 15;

                    // Calculate how much they overlap
                    const overlap = minDist - dist;
                    const collisionAngle = Math.atan2(dy, dx);
                    
                    // Push this particle away from the other
                    const pushX = Math.cos(collisionAngle) * (overlap / 2);
                    const pushY = Math.sin(collisionAngle) * (overlap / 2);
                    
                    this.x += pushX;
                    this.y += pushY;
                    
                    // Dampen velocity to prevent extreme jittering when crowded
                    this.vx *= 0.85;
                    this.vy *= 0.85;
                }
            }

            // Save position to history for the trail
            this.history.push({ x: this.x, y: this.y });
            if (this.history.length > this.maxHistory) {
                this.history.shift(); 
            }
        }

        draw() {
            // Determine Color based on state
            let hue;
            if (mouse.isDown) {
                hue = 120; // Green when mouse is held
            } else if (this.collisionTimer > 0) {
                hue = 0; // Red when colliding with another particle
            } else {
                hue = 180; // Cyan base color
            }

            ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;

            // Draw the trail
            for (let i = 0; i < this.history.length; i++) {
                const pos = this.history[i];
                const size = this.baseSize * (i / this.history.length);
                ctx.fillRect(pos.x - size / 2, pos.y - size / 2, size, size);
            }

            // Draw the particle head
            ctx.fillStyle = '#fff';
            ctx.fillRect(this.x - this.baseSize / 2, this.y - this.baseSize / 2, this.baseSize, this.baseSize);
        }
    }

    // Initialize particles
    function initParticles(count) {
        particles = [];
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    // Set the number of particles based on window size
    const particleCount = Math.floor((width * height) / 10000); // Adjust density based on screen size
    initParticles(particleCount);

    // Main animation loop
    function animate() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);

        // Pass the full array to update so particles can check collisions against each other
        particles.forEach(p => {
            p.update(particles);
            p.draw();
        });

        requestAnimationFrame(animate);
    }

    // Start the animation
    initParticles(particleCount);
    animate();

</script>
</body>
</html>
